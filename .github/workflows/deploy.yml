name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH with Password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/-todo-list-devops
            git pull origin main
            
            # Check if SSL certificates exist
            if [ ! -f ./nginx/ssl/fullchain.pem ]; then
              echo "Warning: SSL certificates not found."
              echo "Creating self-signed certificates for temporary use..."
              mkdir -p ./nginx/ssl
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout ./nginx/ssl/privkey.pem \
                -out ./nginx/ssl/fullchain.pem \
                -subj "/CN=${{ secrets.VPS_HOST }}"
              echo "Self-signed certificates created. For production SSL, use Let's Encrypt."
            else
              echo "SSL certificates found. Using existing certificates."
            fi
            
            # Set proper permissions for SSL certificates
            chmod 644 ./nginx/ssl/fullchain.pem
            chmod 600 ./nginx/ssl/privkey.pem
            
            # Deploy with Docker Compose
            docker-compose down
            docker-compose build
            docker-compose up -d
            
            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 30
            
            # Check status
            docker-compose ps
            
            echo "Deployment completed successfully!"
            echo "Application available at: http://${{ secrets.VPS_HOST }}"
            echo "If SSL certificates are configured, also available at: https://${{ secrets.VPS_HOST }}"
